<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#F2F2F7;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Money Counter</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Apple system colors (iOS grouped background + label), light and dark. */
  :root { --bg: #F2F2F7; --fg: #000000; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #FFFFFF; color-scheme: dark; }
  }
  /* San Francisco on Apple devices; Inter as the closest match elsewhere. */
  body, body * {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Helvetica Neue", Arial, sans-serif !important;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); overflow: hidden; }
  #root { display: flex; height: 100%; flex: 1; }
</style>
<noscript>You need to enable JavaScript to use Money Counter.</noscript>
<div id="root"></div>
<script src="app.js" defer></script>

</body></html>
